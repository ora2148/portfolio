<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project History | 김인호</title>

    <link rel="stylesheet" href="style_history.css">
</head>

<body>

    <!-- 헤더 -->
    <header class="top">

        <h1>PROJECT HISTORY</h1>

        <p class="subtitle">
            Development · PM · Portfolio
        </p>

        <nav>
            <a href="index.html">HOME</a>
        </nav>

    </header>

    <!-- 메인 -->
    <main>

        <section class="history-section">

            <h2>PROJECTS</h2>

            <!-- 프로젝트 -->
            <div class="project-card">

                <!-- 이미지 -->
                <div class="project-image">
                    <img src="images/project1.png" alt="프로젝트 이미지">
                </div>

                <!-- 내용 -->
                <div class="project-content">

                    <h3>모바일 앱 개발 프로젝트</h3>

                    <div class="info">
                        <span class="label">기간</span>
                        <p>2025.01 ~ 2025.06</p>
                    </div>

                    <div class="info">
                        <span class="label">담당 업무</span>

                        <ul>
                            <li>Flutter 기반 앱 개발</li>
                            <li>REST API 연동</li>
                            <li>UI/UX 개선</li>
                            <li>프로젝트 일정 관리</li>
                        </ul>
                    </div>

                </div>

            </div>

            <!-- 프로젝트 -->
            <div class="project-card">

                <!-- 이미지 -->
                <div class="project-image">
                    <img src="images/project2.png" alt="프로젝트 이미지">
                </div>

                <!-- 내용 -->
                <div class="project-content">

                    <h3>웹 서비스 개선 프로젝트</h3>

                    <div class="info">
                        <span class="label">기간</span>
                        <p>2024.03 ~ 2024.11</p>
                    </div>

                    <div class="info">
                        <span class="label">담당 업무</span>

                        <ul>
                            <li>반응형 웹 구현</li>
                            <li>다크모드 UI 개발</li>
                            <li>프로젝트 유지보수</li>
                        </ul>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
